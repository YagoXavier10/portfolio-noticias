<style>
  .tw { animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .8 } }
  .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
  .rise2 { animation: rise 1s .25s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

  .tick { animation: tick 22s linear infinite; }
  @keyframes tick { from { transform: translateX(0) } to { transform: translateX(-1160px) } }
  .spin { transform-origin: 900px 96px; animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .live { animation: live 1.4s ease-in-out infinite; }
  @keyframes live { 50% { opacity: .25 } }
</style>
