name: Atualizar conquistas da Cohab

on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda-feira às 06:00 de Brasília (09:00 UTC)
  workflow_dispatch:        # botão "Run workflow" para rodar na mão

permissions:
  contents: write

concurrency:
  group: commits-do-robo   # não roda junto com outro workflow que faz commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar novas conquistas
        run: python scripts/update_cohab.py

      - name: Commit e push
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "Sem novidades" && exit 0
          git commit -m "🥋 Conquistas da Cohab atualizadas em $(TZ=America/Sao_Paulo date +'%d/%m/%Y')"
          git pull --rebase
          git push
