name: Atualizar notícias

on:
  schedule:
    - cron: "0 10 * * *"   # todo dia às 07:00 de Brasília (10:00 UTC)
  workflow_dispatch:        # botão "Run workflow" para rodar na mão

permissions:
  contents: write

concurrency:
  group: commits-do-robo   # não roda junto com o workflow da Cohab
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar notícias
        run: python scripts/fetch_news.py
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}   # opcional

      - name: Commit e push
        run: |
          # O e-mail noreply do seu usuário faz o commit contar no seu gráfico
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet && echo "Sem novidades" && exit 0
          git commit -m "📰 Notícias de $(TZ=America/Sao_Paulo date +'%d/%m/%Y')"
          git pull --rebase
          git push
